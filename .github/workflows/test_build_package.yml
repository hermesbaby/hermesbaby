name: Test, Build and Package

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  actions: read

jobs:
  test_build_package:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        python-version: "3.12"

    - name: Install dependencies
      run: |
        uv sync --all-groups --locked

    - name: Install external tools
      run: |
        sudo ./src/hermesbaby/ci/setup.sh

    - name: Run unit tests
      run: |
        uv run --locked pytest

    - name: Run e2e tests
      run: |
        uv run --locked tests/e2e/bats/bin/bats --tap --verbose-run -x tests/e2e/

    - name: Build package
      run: |
        uv build --no-sources

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hermesbaby-dist
        path: dist/
        retention-days: ${{ github.ref_name == 'main' && 90 || 7 }}
